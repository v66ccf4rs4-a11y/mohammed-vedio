<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>صلوا عليه وسلموا تسليما</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="lib/gsap.min.js"></script>
    <style>
      :root { --gold: #d8b46a; --gold-soft: #ead7a4; --cream: #f8f1e0; --ink: #05080a; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }

      .scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
      .scene video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* soft warm grade + vignette */
      #grade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255, 214, 150, .10), rgba(255, 190, 120, .06)); mix-blend-mode: soft-light; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 65% at 50% 40%, transparent 50%, rgba(0, 0, 0, .55) 100%); }
      #glow { position: absolute; left: -200px; top: -300px; width: 1100px; height: 1100px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 220, 160, .22), transparent 65%); mix-blend-mode: screen; }

      /* lower text panel (also hides the card burnt into the source) */
      #panel { position: absolute; left: 0; right: 0; top: 820px; bottom: 0;
        background: linear-gradient(180deg, rgba(5, 8, 10, 0) 0%, rgba(5, 8, 10, .75) 18%, rgba(5, 8, 10, .97) 30%, #05080a 38%, #05080a 100%); }

      #divider { position: absolute; left: 50%; top: 1150px; width: 520px; height: 40px; margin-left: -260px; opacity: 0; }

      .phrase { position: absolute; left: 70px; right: 70px; top: 1215px; direction: rtl; text-align: center; }
      .line { display: flex; justify-content: center; flex-wrap: wrap; gap: 0 22px; line-height: 1.75; }
      .w { display: inline-block; font-family: "Amiri", serif; font-weight: 400; font-size: 76px; color: var(--cream); opacity: 0;
        text-shadow: 0 2px 18px rgba(0, 0, 0, .6); }
      .w.key { color: var(--gold-soft); font-weight: 700; }

      #label { position: absolute; left: 0; right: 0; top: 1260px; text-align: center; direction: rtl; opacity: 0;
        font-family: "Amiri", serif; font-size: 54px; color: var(--gold-soft); letter-spacing: 0; }
      #label small { display: block; font-size: 38px; color: rgba(248, 241, 224, .7); margin-top: 8px; }

      #saw { position: absolute; left: 0; right: 0; top: 1170px; text-align: center; opacity: 0;
        font-family: "Amiri", serif; font-size: 250px; line-height: 1.2; color: var(--gold-soft); text-shadow: 0 0 40px rgba(255, 215, 140, .35); }

      #grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay; }
      #fade { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <!-- footage: one continuous source, framed four ways with slow dissolves -->
      <div class="scene" id="sA"><video id="vA" class="clip" src="media/kaaba.mp4" muted playsinline data-start="0" data-duration="6.8" data-media-start="0"></video></div>
      <div class="scene" id="sB"><video id="vB" class="clip" src="media/kaaba.mp4" muted playsinline data-start="5.3" data-duration="7.5" data-media-start="5.3"></video></div>
      <div class="scene" id="sC"><video id="vC" class="clip" src="media/kaaba.mp4" muted playsinline data-start="11.3" data-duration="6.8" data-media-start="11.3"></video></div>
      <div class="scene" id="sD"><video id="vD" class="clip" src="media/kaaba.mp4" muted playsinline data-start="16.6" data-duration="7.85" data-media-start="16.6"></video></div>

      <div id="grade"></div>
      <div id="glow"></div>
      <div id="vignette" data-layout-allow-occlusion></div>
      <div id="panel" data-layout-allow-occlusion></div>

      <svg id="divider" viewBox="0 0 520 40">
        <line x1="10" y1="20" x2="225" y2="20" stroke="#d8b46a" stroke-width="1.5" opacity=".8" />
        <line x1="295" y1="20" x2="510" y2="20" stroke="#d8b46a" stroke-width="1.5" opacity=".8" />
        <polygon id="star" fill="none" stroke="#ead7a4" stroke-width="2" />
        <circle cx="260" cy="20" r="3.5" fill="#ead7a4" />
      </svg>

      <div id="text"></div>

      <div id="label">سورة الأحزاب<small>الآية ٥٦</small></div>
      <div id="saw">ﷺ</div>

      <svg id="grain" viewBox="0 0 1080 1920" data-layout-allow-occlusion>
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch" /></filter>
        <rect width="100%" height="100%" filter="url(#noise)" />
      </svg>
      <div id="fade" data-layout-allow-occlusion></div>

      <audio id="a-roll-audio" src="audio.mp3" data-start="0" data-duration="24.5" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      // 8-point star for the divider
      (function () {
        const p = [];
        for (let i = 0; i < 16; i++) {
          const r = i % 2 ? 7 : 16, a = (Math.PI * i) / 8 - Math.PI / 2;
          p.push((260 + r * Math.cos(a)).toFixed(1) + "," + (20 + r * Math.sin(a)).toFixed(1));
        }
        document.getElementById("star").setAttribute("points", p.join(" "));
      })();

      // phrases, word onsets taken from the recitation
      const PHRASES = [
        { id: "p1", end: 4.6, lines: [[["إِنَّ", 0.9], ["اللَّهَ", 1.2, "key"], ["وَمَلَائِكَتَهُ", 1.6]], [["يُصَلُّونَ", 2.36], ["عَلَى", 3.24], ["النَّبِيِّ", 3.46, "key"]]] },
        { id: "p2", end: 10.0, lines: [[["يَا", 5.82], ["أَيُّهَا", 6.05], ["الَّذِينَ", 6.36], ["آمَنُوا", 6.8]], [["صَلُّوا", 7.42, "key"], ["عَلَيْهِ", 7.9], ["وَسَلِّمُوا", 8.18, "key"], ["تَسْلِيمًا", 9.06]]] },
        { id: "p3", end: 16.4, lines: [[["اللَّهُمَّ", 12.1, "key"], ["صَلِّ", 12.42], ["وَسَلِّمْ", 12.88], ["وَبَارِكْ", 13.46]], [["عَلَى", 14.06], ["سَيِّدِنَا", 14.28], ["مُحَمَّدٍ", 15.02, "key"]]] },
        { id: "p4", end: 21.8, lines: [[["وَعَلَى", 17.35], ["آلِهِ", 17.64], ["وَصَحْبِهِ", 18.18]], [["وَسَلِّمْ", 18.96], ["تَسْلِيمًا", 19.76], ["كَثِيرًا", 20.7, "key"]]] },
      ];
      const host = document.getElementById("text");
      PHRASES.forEach((ph) => {
        const el = document.createElement("div"); el.className = "phrase"; el.id = ph.id;
        ph.words = [];
        ph.lines.forEach((ln) => {
          const L = document.createElement("div"); L.className = "line";
          ln.forEach(([txt, t, k]) => {
            const w = document.createElement("span"); w.className = "w" + (k ? " " + k : ""); w.textContent = txt;
            L.appendChild(w); ph.words.push({ el: w, t });
          });
          el.appendChild(L);
        });
        host.appendChild(el);
      });

      const tl = gsap.timeline({ paused: true });
      const DUR = 24.5, X = 1.6; // X = cross-dissolve length

      // ---- footage: slow, gentle camera moves + long dissolves
      // origins are fractions of the source frame (calligraphy belt, sky, full view)
      const SC = [
        { id: "#sA", t0: 0, t1: 6.8, origin: "42% 40%", from: { scale: 1.0, y: 0 }, to: { scale: 1.07, y: -10 } },
        { id: "#sB", t0: 5.3, t1: 12.8, origin: "38% 38%", from: { scale: 1.75, x: 30 }, to: { scale: 1.82, x: -30 } },
        { id: "#sC", t0: 11.3, t1: 18.1, origin: "86% 30%", from: { scale: 2.0, y: 10 }, to: { scale: 1.88, y: -20 } },
        { id: "#sD", t0: 16.6, t1: 24.5, origin: "50% 40%", from: { scale: 1.16 }, to: { scale: 1.0 } },
      ];
      SC.forEach((s, i) => {
        tl.set(s.id, { transformOrigin: s.origin }, 0);
        tl.fromTo(s.id, s.from, { ...s.to, duration: s.t1 - s.t0, ease: "none" }, s.t0);
        if (i === 0) tl.fromTo(s.id, { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.out" }, 0);
        else tl.fromTo(s.id, { opacity: 0 }, { opacity: 1, duration: X, ease: "sine.inOut" }, s.t0);
      });
      tl.to("#glow", { x: 420, y: 260, duration: DUR, ease: "sine.inOut" }, 0);

      // ---- opening fade from black
      tl.fromTo("#fade", { opacity: 1 }, { opacity: 0, duration: 1.4, ease: "sine.out" }, 0);
      tl.fromTo("#divider", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 1.6, ease: "sine.out" }, 0.3);
      tl.to("#star", { rotation: 90, transformOrigin: "50% 50%", duration: DUR, ease: "none" }, 0);

      // ---- words: soft reveal, phrase fades out gently
      PHRASES.forEach((ph) => {
        ph.words.forEach((w) => {
          tl.fromTo(w.el, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "sine.out" }, w.t - 0.08);
        });
        tl.to("#" + ph.id, { opacity: 0, y: -10, filter: "blur(4px)", duration: 0.9, ease: "sine.inOut" }, ph.end);
      });

      // ---- surah reference in the pause between verse and salawat
      tl.fromTo("#label", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.7, ease: "sine.out" }, 10.9);
      tl.to("#label", { opacity: 0, duration: 0.6, ease: "sine.inOut" }, 11.75);

      // ---- closing
      tl.fromTo("#saw", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 1.3, ease: "sine.out" }, 22.65);
      tl.to("#divider", { opacity: 0, duration: 1.0 }, 22.0);
      tl.to("#fade", { opacity: 1, duration: 1.3, ease: "sine.in" }, 23.2);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

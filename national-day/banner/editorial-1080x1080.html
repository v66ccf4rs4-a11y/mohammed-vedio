<!doctype html><html lang="ar"><head><meta charset="utf-8"><title>Editorial Banner</title><link rel="stylesheet" href="_base.css"><style>
.banner{background:var(--paper);color:var(--ink);padding:84px 96px;display:flex;flex-direction:column}
.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:22px;font-size:22px;font-weight:500}
.mast .t{font-family:'Amiri',serif;font-size:40px;font-weight:700}
.big{position:absolute;left:30px;bottom:-200px;font-size:520px;font-weight:800;line-height:1;color:var(--green);opacity:.13;letter-spacing:-.04em}
.kicker{margin-top:90px;font-size:26px;font-weight:600;color:var(--green)}
h1{font-size:150px;line-height:1.55;font-weight:700;margin-top:110px}
.sub{font-size:34px;line-height:1.6;max-width:760px;margin-top:22px;font-family:'Amiri',serif;color:#3d4d3e}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #8b9386;padding-top:22px;font-size:22px;color:#515f51}
.pill{background:var(--green);color:var(--paper);padding:14px 30px;font-size:24px;font-weight:600}
</style></head><body>
<div class="banner">
  <div class="num big">٩٦</div>
  <div class="mast"><span class="t">اليوم الوطني</span><span>العدد ٩٦ · سبتمبر ٢٠٢٦</span></div>
  <h1 class="serif">وطنٌ<br>توحَّد</h1>
  <p class="sub">في الثالث والعشرين من سبتمبر صار للجزيرة اسمٌ واحد وراية واحدة.</p>
  <div class="foot"><span>المملكة العربية السعودية</span><span class="pill">٢٣ سبتمبر</span></div>
</div></body></html>

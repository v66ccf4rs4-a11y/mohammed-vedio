<!doctype html><html lang="ar"><head><meta charset="utf-8"><title>Bold Type Banner</title><link rel="stylesheet" href="_base.css"><style>
.banner{background:radial-gradient(120% 90% at 85% 10%,#2e6b4f 0%,#174a32 40%,#0d2418 100%);color:var(--paper);padding:90px 96px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;font-size:24px;font-weight:500;opacity:.85}
.n{font-size:380px;font-weight:700;line-height:1.1;margin-top:0;color:transparent;-webkit-text-stroke:3px var(--mint);text-align:left;letter-spacing:-.03em}
h1{font-size:112px;line-height:1.5;font-weight:700;margin-top:10px}
.line{display:flex;align-items:center;gap:24px;margin-top:auto;font-size:26px}
.line .rule{flex:1;height:2px;background:var(--gold)}
.line b{color:var(--gold);font-weight:600}
</style></head><body>
<div class="banner">
  <div class="top"><span>اليوم الوطني السعودي</span><span class="num">١٩٣٢ — ٢٠٢٦</span></div>
  <div class="num n">٩٦</div>
  <h1 class="serif">كل عامٍ والوطن بخير</h1>
  <div class="line"><b>٢٣ سبتمبر</b><span class="rule"></span><span>المملكة العربية السعودية</span></div>
</div></body></html>

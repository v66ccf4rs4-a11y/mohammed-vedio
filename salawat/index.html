<!doctype html>
<html lang="ar" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>صلوا عليه وسلموا تسليما</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <script src="lib/gsap.min.js"></script>
    <style>
      :root {
        --night: #03080a;
        --emerald: #0a3a2c;
        --emerald-hi: #12634a;
        --lapis: #0b1f4a;
        --lapis-hi: #1d3f8f;
        --wine: #3a0c1d;
        --gold: #d6a840;
        --gold-hi: #ffe39a;
        --gold-deep: #8a6318;
        --cream: #f7ecd0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--night);
      }
      body { font-family: "Amiri", serif; color: var(--cream); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--night); }
      .full { position: absolute; inset: 0; }
      .center { position: absolute; left: 50%; top: 50%; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 50%; }

      /* background washes */
      .bg { position: absolute; inset: -10%; opacity: 0; }
      #bg-emerald { background: radial-gradient(ellipse 70% 55% at 50% 48%, var(--emerald-hi) 0%, var(--emerald) 38%, var(--night) 100%); }
      #bg-lapis { background: radial-gradient(ellipse 70% 55% at 50% 48%, var(--lapis-hi) 0%, var(--lapis) 40%, var(--night) 100%); }
      #bg-wine { background: radial-gradient(ellipse 70% 55% at 50% 48%, #6b1631 0%, var(--wine) 40%, var(--night) 100%); }
      #bg-gold { background: radial-gradient(ellipse 60% 45% at 50% 50%, #5a4310 0%, #1d2a12 45%, var(--night) 100%); }

      #girih { position: absolute; left: 50%; top: 50%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px; opacity: 0; }
      #rays {
        position: absolute; left: 50%; top: 50%; width: 3000px; height: 3000px; margin: -1500px 0 0 -1500px;
        background: repeating-conic-gradient(from 0deg, rgba(255, 216, 130, 0.22) 0deg 3deg, rgba(255, 216, 130, 0) 3deg 12deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 22%, transparent 55%);
        mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,.55) 22%, transparent 55%);
        mix-blend-mode: screen; opacity: 0;
      }
      .ring { position: absolute; left: 50%; top: 50%; }
      #mandala { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      #mandala svg { position: absolute; overflow: visible; }
      #glow-core {
        position: absolute; left: 50%; top: 50%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 226, 150, 0.55) 0%, rgba(214, 168, 64, 0.18) 35%, transparent 68%);
        mix-blend-mode: screen; opacity: 0;
      }

      #tunnel svg, #burst-rosettes svg { position: absolute; left: 50%; top: 50%; overflow: visible; }
      .shock {
        position: absolute; left: 50%; top: 50%; width: 400px; height: 400px; margin: -200px 0 0 -200px;
        border-radius: 50%; border: 10px solid var(--gold-hi); opacity: 0;
        box-shadow: 0 0 40px rgba(255, 220, 140, .8), inset 0 0 40px rgba(255, 220, 140, .6);
      }
      .p { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff8dc 0%, var(--gold-hi) 35%, rgba(214,168,64,0) 70%); }

      #arch { position: absolute; inset: 0; overflow: visible; }
      #lanterns { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .lantern { position: absolute; top: -40px; transform-origin: 50% 0%; }

      /* typography */
      .block {
        position: absolute; left: 130px; right: 130px; top: 50%; direction: rtl; text-align: center;
        transform: translateY(-50%); opacity: 0;
      }
      .line { display: flex; flex-direction: row; justify-content: center; align-items: baseline; gap: 0 28px; line-height: 1.5; }
      .w {
        display: inline-block; font-family: "Amiri", serif; font-weight: 700; font-size: 100px; color: var(--cream);
        opacity: 0; white-space: nowrap; will-change: transform, opacity, filter;
        text-shadow: 0 0 0 rgba(255, 220, 140, 0);
      }
      .w.hero {
        font-family: "Aref Ruqaa", serif; font-size: 148px;
        background: linear-gradient(180deg, #fff6d0 0%, var(--gold-hi) 30%, var(--gold) 62%, var(--gold-deep) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 22px rgba(255, 210, 110, .55));
      }
      .kicker {
        position: absolute; left: 0; right: 0; text-align: center; font-family: "Reem Kufi", sans-serif; font-weight: 700;
        letter-spacing: 0; color: var(--gold-hi); opacity: 0; direction: rtl;
      }

      #plate { position: absolute; left: 50%; top: 50%; width: 900px; height: 520px; margin: -260px 0 0 -450px; opacity: 0; }
      #plate svg { position: absolute; inset: 0; overflow: visible; }
      #plate .t1 { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-family: "Aref Ruqaa", serif; font-weight: 700; font-size: 128px; color: var(--gold-hi); direction: rtl; text-shadow: 0 0 30px rgba(255,210,110,.6); }
      #plate .t2 { position: absolute; left: 0; right: 0; top: 345px; text-align: center; font-family: "Amiri", serif; font-weight: 700; font-size: 64px; color: var(--cream); direction: rtl; }

      #muhammad::before, #outro::before { content: ""; position: absolute; left: 40px; right: 40px; top: -560px; height: 1000px; background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(3,8,10,.72), transparent 75%); }
      #muhammad { position: absolute; left: 0; right: 0; top: 50%; height: 0; opacity: 0; }
      #muhammad .name {
        position: absolute; left: 0; right: 0; top: -430px; padding: 40px 0; text-align: center; font-family: "Amiri", serif; font-weight: 700;
        font-size: 300px; line-height: 1.5; direction: rtl;
        background: linear-gradient(180deg, #fffbe6 0%, var(--gold-hi) 28%, var(--gold) 60%, var(--gold-deep) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        filter: drop-shadow(0 0 40px rgba(255, 210, 110, .75));
      }
      #muhammad .saw {
        position: absolute; left: 0; right: 0; top: 120px; text-align: center; font-family: "Amiri", serif; font-size: 230px; line-height: 1.3;
        color: var(--gold-hi); text-shadow: 0 0 40px rgba(255, 210, 110, .8);
      }

      #outro { position: absolute; left: 0; right: 0; top: 50%; height: 0; opacity: 0; }
      #outro .saw { position: absolute; left: 0; right: 0; top: -440px; text-align: center; font-family: "Amiri", serif; font-size: 380px; line-height: 1.2; color: var(--gold-hi); text-shadow: 0 0 60px rgba(255, 210, 110, .9); }
      #outro .sub { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font-family: "Amiri", serif; font-weight: 700; font-size: 70px; text-shadow: 0 0 20px rgba(0,0,0,.8); color: var(--cream); direction: rtl; }

      #flash { position: absolute; inset: 0; background: #fff4d6; opacity: 0; mix-blend-mode: screen; }
      #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 60% at 50% 50%, transparent 55%, rgba(0,0,0,.85) 100%); pointer-events: none; }
      #grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: overlay; pointer-events: none; }
      #iris { position: absolute; inset: 0; background: #000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24.5" data-width="1080" data-height="1920">
      <div id="cam">
        <div id="bg-emerald" class="bg"></div>
        <div id="bg-lapis" class="bg"></div>
        <div id="bg-wine" class="bg"></div>
        <div id="bg-gold" class="bg"></div>
        <svg id="girih" viewBox="0 0 2600 2600"></svg>
        <div id="rays"></div>
        <div id="glow-core"></div>
        <div id="mandala"></div>
        <div id="tunnel" class="full"></div>
        <div id="shocks" class="full"></div>
        <div id="particles" class="full"></div>
        <div id="burst" class="full"></div>
        <div id="burst-rosettes" class="full"></div>
        <svg id="arch" viewBox="0 0 1080 1920"></svg>
        <div id="lanterns"></div>

        <div id="text-layer" class="full"></div>

        <div id="plate">
          <svg viewBox="0 0 900 520" id="plate-svg"></svg>
          <div class="t1">سورة الأحزاب</div>
          <div class="t2">الآية ﴿٥٦﴾</div>
        </div>

        <div id="muhammad">
          <div class="name">محمد</div>
          <div class="saw">ﷺ</div>
        </div>

        <div id="outro">
          <div class="saw">ﷺ</div>
          <div class="sub">اللهم صلِّ وسلِّم على نبينا محمد</div>
        </div>
      </div>
      <div id="flash" data-layout-allow-occlusion></div>
      <div id="vignette" data-layout-allow-occlusion></div>
      <svg id="grain" data-layout-allow-occlusion viewBox="0 0 1080 1920">
        <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" /></filter>
        <rect width="100%" height="100%" filter="url(#noise)" />
      </svg>
      <div id="iris" data-layout-allow-occlusion></div>

      <audio id="a-roll-audio" src="audio.mp3" data-start="0" data-duration="24.5" data-track-index="2" data-volume="1"></audio>
    </div>

    <script>
      // ---------- helpers ----------
      const NS = "http://www.w3.org/2000/svg";
      const $ = (s) => document.querySelector(s);
      function rng(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const R = rng(56);
      const GOLD = "#d6a840", GOLD_HI = "#ffe39a", CREAM = "#f7ecd0";

      function starPts(n, ro, ri, rot = 0, cx = 0, cy = 0) {
        const p = [];
        for (let i = 0; i < n * 2; i++) {
          const r = i % 2 ? ri : ro;
          const a = (Math.PI * i) / n + rot - Math.PI / 2;
          p.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
        }
        return p.join(" ");
      }
      function polyPts(n, r, rot = 0, cx = 0, cy = 0) {
        const p = [];
        for (let i = 0; i < n; i++) {
          const a = (2 * Math.PI * i) / n + rot;
          p.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
        }
        return p.join(" ");
      }
      // A single rosette, centred on 0,0
      function rosetteSVG(size, opts = {}) {
        const s = size / 2, c = opts.color || GOLD, w = opts.w || 3;
        let g = "";
        g += `<polygon points="${starPts(8, s * 0.98, s * 0.55)}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
        g += `<polygon points="${starPts(8, s * 0.98, s * 0.55, Math.PI / 8)}" fill="none" stroke="${c}" stroke-width="${w}" opacity=".7"/>`;
        g += `<polygon points="${polyPts(8, s * 0.42, Math.PI / 8)}" fill="${opts.fill || "none"}" stroke="${c}" stroke-width="${w}"/>`;
        g += `<polygon points="${starPts(8, s * 0.36, s * 0.2)}" fill="none" stroke="${GOLD_HI}" stroke-width="${w}"/>`;
        g += `<circle r="${s * 0.12}" fill="${GOLD_HI}"/>`;
        return `<svg xmlns="${NS}" width="${size}" height="${size}" viewBox="${-s} ${-s} ${size} ${size}" style="margin:${-s}px 0 0 ${-s}px">${g}</svg>`;
      }

      // ---------- girih background (8-fold khatam tiling) ----------
      (function buildGirih() {
        const svg = $("#girih");
        const T = 200;
        let tile = "";
        // central 8-point star and the lines that interlace into neighbours
        tile += `<polygon points="${starPts(8, 84, 46, 0, 100, 100)}" fill="none" stroke="${GOLD}" stroke-width="2.4"/>`;
        tile += `<polygon points="${polyPts(8, 40, Math.PI / 8, 100, 100)}" fill="none" stroke="${GOLD}" stroke-width="1.6" opacity=".7"/>`;
        tile += `<polygon points="${starPts(4, 100 * Math.SQRT2, 40, Math.PI / 4, 100, 100)}" fill="none" stroke="${GOLD}" stroke-width="1.4" opacity=".55"/>`;
        // corner quarter-stars
        for (const [x, y] of [[0, 0], [T, 0], [0, T], [T, T]]) {
          tile += `<polygon points="${starPts(8, 34, 20, 0, x, y)}" fill="none" stroke="${GOLD}" stroke-width="1.8"/>`;
          tile += `<circle cx="${x}" cy="${y}" r="5" fill="${GOLD}"/>`;
        }
        svg.innerHTML =
          `<defs><pattern id="khatam" width="${T}" height="${T}" patternUnits="userSpaceOnUse">${tile}</pattern>
            <radialGradient id="gfade"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".55" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <mask id="gmask"><rect width="2600" height="2600" fill="url(#gfade)"/></mask></defs>
           <rect width="2600" height="2600" fill="url(#khatam)" mask="url(#gmask)"/>`;
      })();

      // ---------- central mandala (layered, counter-rotating) ----------
      const rings = [];
      (function buildMandala() {
        const host = $("#mandala");
        const defs = [];
        // 1: lace of dots
        defs.push((s) => { let g = ""; for (let i = 0; i < 64; i++) { const a = (i / 64) * Math.PI * 2; g += `<circle cx="${(s * Math.cos(a)).toFixed(1)}" cy="${(s * Math.sin(a)).toFixed(1)}" r="${i % 2 ? 4 : 7}" fill="${GOLD}"/>`; } return g + `<circle r="${s - 18}" fill="none" stroke="${GOLD}" stroke-width="2"/>`; });
        // 2: 16-point star
        defs.push((s) => `<polygon points="${starPts(16, s, s * 0.78)}" fill="none" stroke="${GOLD}" stroke-width="3"/><polygon points="${starPts(16, s * 0.94, s * 0.78, Math.PI / 16)}" fill="none" stroke="${GOLD_HI}" stroke-width="1.5" opacity=".6"/>`);
        // 3: 12 petals
        defs.push((s) => { let g = ""; for (let i = 0; i < 12; i++) { g += `<ellipse cx="0" cy="${-s * 0.55}" rx="${s * 0.16}" ry="${s * 0.45}" transform="rotate(${i * 30})" fill="none" stroke="${GOLD}" stroke-width="3"/>`; } return g; });
        // 4: double 8-star (khatam)
        defs.push((s) => `<polygon points="${starPts(8, s, s * 0.62)}" fill="rgba(214,168,64,.06)" stroke="${GOLD_HI}" stroke-width="4"/><polygon points="${starPts(8, s, s * 0.62, Math.PI / 8)}" fill="none" stroke="${GOLD}" stroke-width="3"/>`);
        // 5: 24 arcs (muqarnas-like scallops)
        defs.push((s) => { let g = ""; for (let i = 0; i < 24; i++) { g += `<path d="M ${-s * 0.13} ${-s * 0.86} Q 0 ${-s * 1.08} ${s * 0.13} ${-s * 0.86}" transform="rotate(${i * 15})" fill="none" stroke="${GOLD}" stroke-width="3"/>`; } return g + `<circle r="${s * 0.86}" fill="none" stroke="${GOLD}" stroke-width="2"/>`; });
        // 6: inner rosette
        defs.push((s) => `<polygon points="${polyPts(8, s, Math.PI / 8)}" fill="none" stroke="${GOLD}" stroke-width="3"/><polygon points="${starPts(8, s * 0.86, s * 0.45)}" fill="rgba(255,227,154,.12)" stroke="${GOLD_HI}" stroke-width="3"/><circle r="${s * 0.18}" fill="${GOLD_HI}"/>`);
        const sizes = [520, 440, 360, 280, 200, 110];
        defs.forEach((fn, i) => {
          const s = sizes[i];
          const el = document.createElementNS(NS, "svg");
          el.setAttribute("width", s * 2 + 40); el.setAttribute("height", s * 2 + 40);
          el.setAttribute("viewBox", `${-s - 20} ${-s - 20} ${s * 2 + 40} ${s * 2 + 40}`);
          el.style.left = -(s + 20) + "px"; el.style.top = -(s + 20) + "px";
          el.innerHTML = fn(s);
          host.appendChild(el); rings.push(el);
        });
      })();

      // ---------- tunnel of stars ----------
      const tunnel = [];
      for (let i = 0; i < 12; i++) {
        const d = document.createElement("div");
        d.innerHTML = `<svg xmlns="${NS}" width="1000" height="1000" viewBox="-500 -500 1000 1000" style="margin:-500px 0 0 -500px"><polygon points="${starPts(8, 480, 300, i % 2 ? Math.PI / 8 : 0)}" fill="none" stroke="${i % 3 ? GOLD : GOLD_HI}" stroke-width="7"/><polygon points="${polyPts(8, 280, Math.PI / 8)}" fill="none" stroke="${GOLD}" stroke-width="3" opacity=".6"/></svg>`;
        const el = d.firstChild; el.style.opacity = 0; $("#tunnel").appendChild(el); tunnel.push(el);
      }

      // ---------- shockwaves ----------
      const shocks = [];
      for (let i = 0; i < 6; i++) { const s = document.createElement("div"); s.className = "shock"; $("#shocks").appendChild(s); shocks.push(s); }

      // ---------- ambient particles ----------
      const parts = [];
      for (let i = 0; i < 90; i++) {
        const p = document.createElement("div"); p.className = "p";
        const sz = 6 + R() * 18; p.style.width = p.style.height = sz + "px";
        p.style.left = R() * 1080 + "px"; p.style.top = R() * 2100 + "px";
        $("#particles").appendChild(p); parts.push({ el: p, sway: (R() - 0.5) * 160, rise: 500 + R() * 900, op: 0.3 + R() * 0.7 });
      }
      // burst particles (for the name)
      const burst = [];
      for (let i = 0; i < 80; i++) {
        const p = document.createElement("div"); p.className = "p";
        const sz = 8 + R() * 26; p.style.width = p.style.height = sz + "px";
        p.style.left = 540 - sz / 2 + "px"; p.style.top = 960 - sz / 2 + "px"; p.style.opacity = 0;
        $("#burst").appendChild(p);
        const a = R() * Math.PI * 2, dist = 350 + R() * 900;
        burst.push({ el: p, x: Math.cos(a) * dist, y: Math.sin(a) * dist });
      }
      // kaleidoscope rosettes for "كثيرا"
      const minis = [];
      for (let i = 0; i < 30; i++) {
        const size = 60 + R() * 150;
        const d = document.createElement("div"); d.innerHTML = rosetteSVG(size, { w: 3 });
        const el = d.firstChild; el.style.left = 50 + R() * 980 + "px"; el.style.top = 120 + R() * 1680 + "px"; el.style.opacity = 0;
        // keep the middle clear for the words
        const ty = parseFloat(el.style.top); if (ty > 650 && ty < 1270) el.style.top = (ty < 960 ? ty - 420 : ty + 420) + "px";
        $("#burst-rosettes").appendChild(el); minis.push(el);
      }

      // ---------- mihrab arch frame ----------
      (function buildArch() {
        const svg = $("#arch");
        // ogee arch: two concentric outlines + inner lace
        const arch = (inset) => {
          const L = 70 + inset, Rr = 1010 - inset, B = 1850 - inset, S = 640 + inset * 0.6, A = 150 + inset;
          return `M ${L} ${B} L ${L} ${S} C ${L} ${S - 260} ${540 - 240} ${A + 140} 540 ${A} C ${540 + 240} ${A + 140} ${Rr} ${S - 260} ${Rr} ${S} L ${Rr} ${B} Z`;
        };
        svg.innerHTML = `
          <path id="arch-a" d="${arch(0)}" fill="none" stroke="${GOLD}" stroke-width="5"/>
          <path id="arch-b" d="${arch(26)}" fill="none" stroke="${GOLD_HI}" stroke-width="2" opacity=".8"/>
          <path id="arch-c" d="${arch(44)}" fill="none" stroke="${GOLD}" stroke-width="1.5" stroke-dasharray="2 14" stroke-linecap="round" opacity=".9"/>
          <g id="finial" transform="translate(540 ${150 - 60})">${`<polygon points="${starPts(8, 46, 24)}" fill="${GOLD_HI}"/><circle r="12" fill="#3a2a06"/>`}</g>`;
        ["#arch-a", "#arch-b"].forEach((id) => { const p = svg.querySelector(id); const L = p.getTotalLength(); p.style.strokeDasharray = L; p.style.strokeDashoffset = L; p.dataset.len = L; });
      })();

      // ---------- lanterns (fanous) ----------
      const lanterns = [];
      [[150, 330, 1.0], [330, 210, 0.8], [750, 250, 0.85], [930, 360, 1.05]].forEach(([x, len, sc], i) => {
        const d = document.createElement("div"); d.className = "lantern"; d.style.left = x - 60 + "px";
        d.innerHTML = `<svg width="120" height="${len + 200}" viewBox="-60 0 120 ${len + 200}">
          <line x1="0" y1="0" x2="0" y2="${len}" stroke="${GOLD}" stroke-width="2"/>
          <g transform="translate(0 ${len}) scale(${sc})">
            <circle cy="6" r="7" fill="none" stroke="${GOLD}" stroke-width="3"/>
            <polygon points="0,12 -30,48 30,48" fill="${GOLD}"/>
            <path d="M -30 48 L -40 70 L -36 130 L -20 152 L 20 152 L 36 130 L 40 70 L 30 48 Z" fill="rgba(255,200,90,.55)" stroke="${GOLD}" stroke-width="3"/>
            <path d="M 0 52 L 0 150 M -36 100 L 36 100" stroke="${GOLD}" stroke-width="2" opacity=".8"/>
            <ellipse cx="0" cy="100" rx="22" ry="34" fill="#fff3c4" opacity=".9"/>
            <polygon points="-20,152 20,152 0,178" fill="${GOLD}"/>
            <circle cy="100" r="80" fill="url(#lglow${i})"/>
            <defs><radialGradient id="lglow${i}"><stop offset="0" stop-color="#ffd86a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd86a" stop-opacity="0"/></radialGradient></defs>
          </g></svg>`;
        d.style.transform = `translateY(${-len - 260}px)`;
        $("#lanterns").appendChild(d); lanterns.push(d);
      });

      // ---------- surah plate (cartouche) ----------
      (function buildPlate() {
        const svg = $("#plate-svg");
        const W = 900, H = 520;
        const cart = `M 90 40 L ${W - 90} 40 Q ${W - 40} 40 ${W - 40} 90 Q ${W} ${H / 2} ${W - 40} ${H - 90} Q ${W - 40} ${H - 40} ${W - 90} ${H - 40} L 90 ${H - 40} Q 40 ${H - 40} 40 ${H - 90} Q 0 ${H / 2} 40 90 Q 40 40 90 40 Z`;
        svg.innerHTML = `<path d="${cart}" fill="rgba(3,8,10,.72)" stroke="${GOLD}" stroke-width="6"/>
          <path d="${cart}" transform="translate(${W / 2} ${H / 2}) scale(.93) translate(${-W / 2} ${-H / 2})" fill="none" stroke="${GOLD_HI}" stroke-width="2"/>
          <g transform="translate(${W / 2} 40)"><polygon points="${starPts(8, 44, 22)}" fill="${GOLD_HI}"/></g>
          <g transform="translate(${W / 2} ${H - 40})"><polygon points="${starPts(8, 44, 22)}" fill="${GOLD_HI}"/></g>
          <g transform="translate(20 ${H / 2})"><polygon points="${starPts(8, 30, 15)}" fill="${GOLD}"/></g>
          <g transform="translate(${W - 20} ${H / 2})"><polygon points="${starPts(8, 30, 15)}" fill="${GOLD}"/></g>`;
      })();

      // ---------- lyric blocks (word timings from the recitation) ----------
      const BLOCKS = [
        { id: "b1", top: 46, lines: [[["إِنَّ", 0.9], ["اللَّهَ", 1.2, "hero"], ["وَمَلَائِكَتَهُ", 1.6]], [["يُصَلُّونَ", 2.36], ["عَلَى", 3.24], ["النَّبِيِّ", 3.46, "hero"]]] },
        { id: "b2", top: 30, lines: [[["يَا", 5.82], ["أَيُّهَا", 6.05]], [["الَّذِينَ", 6.36], ["آمَنُوا", 6.8]]] },
        { id: "b3", top: 58, lines: [[["صَلُّوا", 7.42], ["عَلَيْهِ", 7.9]], [["وَسَلِّمُوا", 8.18], ["تَسْلِيمًا", 9.06, "hero"]]] },
        { id: "b4", top: 46, lines: [[["اللَّهُمَّ", 12.1, "hero"]], [["صَلِّ", 12.42], ["وَسَلِّمْ", 12.88], ["وَبَارِكْ", 13.46]], [["عَلَى", 14.06], ["سَيِّدِنَا", 14.28]]] },
        { id: "b5", top: 46, lines: [[["وَعَلَى", 17.35], ["آلِهِ", 17.64], ["وَصَحْبِهِ", 18.18]], [["وَسَلِّمْ", 18.96], ["تَسْلِيمًا", 19.76]], [["كَثِيرًا", 20.7, "hero"]]] },
      ];
      const WORDS = [];
      BLOCKS.forEach((b) => {
        const el = document.createElement("div"); el.className = "block"; el.id = b.id; el.style.top = b.top + "%";
        b.lines.forEach((ln) => {
          const L = document.createElement("div"); L.className = "line";
          ln.forEach(([txt, t, kind]) => {
            const w = document.createElement("span"); w.className = "w" + (kind ? " " + kind : ""); w.textContent = txt;
            L.appendChild(w); WORDS.push({ el: w, t, hero: !!kind, block: b.id });
          });
          el.appendChild(L);
        });
        $("#text-layer").appendChild(el); b.el = el;
      });
      const block = (id) => BLOCKS.find((b) => b.id === id).el;

      // =====================================================================
      // TIMELINE
      // =====================================================================
      const tl = gsap.timeline({ paused: true });
      const DUR = 24.5;

      // camera shake helper
      function shake(t, amp = 26, n = 8, dur = 0.5) {
        const r = rng(Math.round(t * 1000));
        const step = dur / n;
        for (let i = 0; i < n; i++) {
          const k = 1 - i / n;
          tl.to("#cam", { x: (r() - 0.5) * 2 * amp * k, y: (r() - 0.5) * 2 * amp * k, rotation: (r() - 0.5) * 1.6 * k, duration: step, ease: "none" }, t + i * step);
        }
        tl.to("#cam", { x: 0, y: 0, rotation: 0, duration: step, ease: "power1.out" }, t + dur);
      }
      function flash(t, peak = 0.85, dur = 0.45) {
        tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: dur, ease: "power2.out", immediateRender: false }, t);
      }
      let shockIdx = 0;
      function shock(t, scale = 6, dur = 0.9) {
        const s = shocks[shockIdx++ % shocks.length];
        tl.fromTo(s, { scale: 0.1, opacity: 1, borderWidth: 18 }, { scale, opacity: 0, borderWidth: 1, duration: dur, ease: "expo.out", immediateRender: false }, t);
      }
      function pulse(t, amt = 1.06) {
        tl.fromTo("#mandala", { scale: amt }, { scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, t);
        tl.fromTo("#glow-core", { opacity: 1 }, { opacity: 0.45, duration: 0.5, ease: "power2.out", immediateRender: false }, t);
      }
      function tunnelRun(t, dur = 1.4, dir = 1) {
        tunnel.forEach((el, i) => {
          const st = t + (i / tunnel.length) * dur * 0.6;
          const from = dir > 0 ? 0.02 : 4.5, to = dir > 0 ? 4.5 : 0.02;
          tl.fromTo(el, { scale: from, opacity: 0, rotation: dir * -20 }, { scale: to, rotation: dir * 40, duration: dur * 0.55, ease: dir > 0 ? "power2.in" : "power2.out", immediateRender: false }, st);
          tl.fromTo(el, { opacity: 0 }, { opacity: 0.95, duration: dur * 0.15, ease: "none", immediateRender: false }, st);
          tl.to(el, { opacity: 0, duration: dur * 0.18, ease: "none" }, st + dur * 0.37);
        });
      }
      function bgTo(id, t, dur = 0.6) {
        ["#bg-emerald", "#bg-lapis", "#bg-wine", "#bg-gold"].forEach((b) => tl.to(b, { opacity: b === id ? 1 : 0, duration: dur, ease: "power2.inOut" }, t));
      }

      // ---- initial state
      tl.set("#mandala", { scale: 0, rotation: -90 }, 0);
      tl.set(".block", { opacity: 1 }, 0);
      tl.set("#girih", { scale: 1.6, rotation: 0 }, 0);

      // ---- perpetual motion
      rings.forEach((el, i) => tl.to(el, { rotation: (i % 2 ? -1 : 1) * (60 + i * 25), duration: DUR, ease: "none" }, 0));
      tl.to("#rays", { rotation: 90, duration: DUR, ease: "none" }, 0);
      tl.to("#girih", { rotation: 22.5, scale: 1.05, duration: DUR, ease: "none" }, 0);
      parts.forEach((p, i) => {
        tl.fromTo(p.el, { y: 0, x: 0, opacity: 0 }, { y: -p.rise, x: p.sway, duration: DUR, ease: "none" }, 0);
        tl.to(p.el, { opacity: p.op, duration: 1.2 }, 0.4 + (i % 10) * 0.08);
      });
      lanterns.forEach((l, i) => {
        const sw = 4 + i;
        for (let k = 0; k < 10; k++) tl.to(l, { rotation: (k % 2 ? -1 : 1) * sw, duration: 1.1 + i * 0.12, ease: "sine.inOut" }, 9.6 + k * (1.1 + i * 0.12));
      });

      // ================= INTRO 0 → 0.9 : spark → explosion
      bgTo("#bg-emerald", 0, 0.7);
      tl.fromTo("#glow-core", { scale: 0.05, opacity: 0 }, { scale: 1.3, opacity: 1, duration: 0.55, ease: "expo.in" }, 0.15);
      tl.to("#glow-core", { scale: 1, opacity: 0.45, duration: 0.6, ease: "expo.out" }, 0.72);
      tl.to("#mandala", { scale: 1, rotation: 0, duration: 1.1, ease: "back.out(1.6)" }, 0.6);
      rings.forEach((el, i) => tl.fromTo(el, { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 0.62 + i * 0.05));
      tl.to("#girih", { opacity: 0.32, duration: 1.2, ease: "power2.out" }, 0.62);
      tl.to("#rays", { opacity: 0.5, duration: 1.0 }, 0.62);
      document.querySelectorAll("#arch-a, #arch-b").forEach((p, i) => tl.to(p, { strokeDashoffset: 0, duration: 1.6, ease: "power3.inOut" }, 0.1 + i * 0.15));
      tl.fromTo("#arch-c", { opacity: 0 }, { opacity: 0.9, duration: 1.0 }, 1.0);
      tl.fromTo("#finial", { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, rotation: 180, duration: 0.8, ease: "back.out(2.5)" }, 1.2);
      flash(0.68, 1, 0.6); shock(0.68, 7, 1.1); shake(0.68, 30, 8, 0.45);

      // mandala dims behind text so words read
      tl.to("#mandala", { opacity: 0.55, duration: 0.6 }, 1.5);

      // ================= WORDS
      WORDS.forEach((w, i) => {
        const el = w.el;
        if (w.hero) {
          tl.fromTo(el, { opacity: 0, scale: 3.4, filter: "blur(26px) drop-shadow(0 0 22px rgba(255,210,110,.55))" },
            { opacity: 1, scale: 1, filter: "blur(0px) drop-shadow(0 0 22px rgba(255,210,110,.55))", duration: 0.55, ease: "expo.out" }, w.t - 0.06);
          flash(w.t, 0.55, 0.4); shock(w.t, 5, 0.8); shake(w.t, 22, 7, 0.4); pulse(w.t, 1.12);
        } else {
          tl.fromTo(el, { opacity: 0, scale: 1.9, y: -40, filter: "blur(16px)", color: "#ffffff", textShadow: "0 0 50px rgba(255,220,140,1)" },
            { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, w.t - 0.05);
          tl.to(el, { color: CREAM, textShadow: "0 0 14px rgba(255,220,140,.25)", duration: 0.9, ease: "power2.out" }, w.t + 0.25);
          pulse(w.t, 1.05);
        }
      });

      // ================= T1 4.3 → 5.8 : zoom-through the star tunnel
      tl.to("#b1", { scale: 2.4, opacity: 0, filter: "blur(18px)", duration: 0.55, ease: "power3.in" }, 4.3);
      tunnelRun(4.35, 1.5, 1);
      bgTo("#bg-lapis", 4.6, 0.8);
      tl.to("#mandala", { rotation: "+=180", scale: 1.35, duration: 1.4, ease: "power3.inOut" }, 4.4);
      tl.to("#girih", { opacity: 0.55, duration: 0.6 }, 4.4);
      tl.to("#girih", { opacity: 0.28, duration: 0.8 }, 5.4);
      tl.to("#mandala", { scale: 1, duration: 0.5, ease: "back.out(2)" }, 5.8);
      flash(5.8, 0.6, 0.4); shock(5.8, 6, 0.9);

      // b2 drifts up / dims as b3 arrives
      tl.to("#b2", { scale: 0.82, y: -60, opacity: 0.55, duration: 0.5, ease: "power3.out" }, 7.35);
      // tasliman (9.06) — horizontal stretch hit
      tl.fromTo("#b3", { scaleX: 1.25 }, { scaleX: 1, duration: 0.6, ease: "elastic.out(1, .4)", immediateRender: false }, 9.06);

      // ================= INTERLUDE 9.8 → 12.0 : surah plate + lanterns
      tl.to(["#b2", "#b3"], { opacity: 0, scale: 0.6, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, 9.8);
      bgTo("#bg-emerald", 9.9, 0.9);
      tl.to("#mandala", { scale: 1.6, opacity: 0.35, duration: 1.2, ease: "power2.inOut" }, 9.9);
      lanterns.forEach((l, i) => tl.to(l, { y: 0, duration: 1.0, ease: "bounce.out" }, 9.95 + i * 0.12));
      tl.fromTo("#plate", { opacity: 0, scale: 0.2, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, 10.15);
      shock(10.2, 5, 0.9);
      tl.fromTo("#plate .t1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.45);
      tl.fromTo("#plate .t2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 10.65);
      tl.to("#plate", { scale: 1.05, duration: 0.7, ease: "sine.inOut" }, 10.9);
      tl.to("#plate", { opacity: 0, scale: 2.6, filter: "blur(16px)", duration: 0.45, ease: "power3.in" }, 11.6);
      tunnelRun(11.4, 1.0, -1);
      tl.to("#mandala", { scale: 1, opacity: 0.55, duration: 0.6, ease: "back.out(1.6)" }, 11.95);

      // ================= B4 12.1 → 15.0 (Allahumma)
      bgTo("#bg-wine", 12.0, 0.4);
      bgTo("#bg-emerald", 12.6, 1.6);

      // ================= MUHAMMAD ﷺ 15.0 → 17.3
      tl.to("#b4", { opacity: 0, scale: 0.4, filter: "blur(20px)", duration: 0.35, ease: "power3.in" }, 14.82);
      bgTo("#bg-gold", 14.95, 0.4);
      tl.fromTo("#muhammad", { opacity: 0, scale: 4, filter: "blur(30px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 15.0);
      tl.fromTo("#muhammad .saw", { scale: 0, rotation: -180, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(2)" }, 15.35);
      flash(15.02, 1, 0.7); shake(15.02, 40, 10, 0.6);
      [0, 0.12, 0.24, 0.5].forEach((d, i) => shock(15.02 + d, 5 + i * 1.5, 1.2));
      burst.forEach((b, i) => {
        tl.fromTo(b.el, { x: 0, y: 0, opacity: 1, scale: 1.4 }, { x: b.x, y: b.y, opacity: 0, scale: 0.4, duration: 1.4 + (i % 5) * 0.15, ease: "expo.out", immediateRender: false }, 15.02);
      });
      tl.to("#rays", { opacity: 1, scale: 1.25, duration: 0.5, ease: "expo.out" }, 15.02);
      tl.to("#mandala", { scale: 1.75, opacity: 0.4, duration: 0.8, ease: "expo.out" }, 15.02);
      tl.to("#mandala", { rotation: "+=120", duration: 2.2, ease: "power2.out" }, 15.02);
      tl.to("#glow-core", { opacity: 1, scale: 1.6, duration: 0.6, ease: "expo.out" }, 15.02);
      tl.to("#muhammad", { scale: 1.08, duration: 1.35, ease: "sine.inOut" }, 15.6);
      // exit
      tl.to("#muhammad", { opacity: 0, scale: 0.2, filter: "blur(20px)", duration: 0.45, ease: "power3.in" }, 16.95);
      tl.to("#rays", { opacity: 0.5, scale: 1, duration: 0.8 }, 17.0);
      tl.to("#glow-core", { opacity: 0.45, scale: 1, duration: 0.6 }, 17.0);
      tl.to("#mandala", { scale: 1, opacity: 0.55, duration: 0.7, ease: "power3.inOut" }, 16.9);
      bgTo("#bg-lapis", 17.0, 0.6);

      // ================= KATHIRA 20.7 : kaleidoscope rosettes everywhere
      minis.forEach((m, i) => {
        const t = 20.7 + i * 0.022;
        tl.fromTo(m, { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 0.9, duration: 0.5, ease: "back.out(2.4)", immediateRender: false }, t);
        tl.to(m, { rotation: 180, duration: 3, ease: "none" }, t + 0.5);
      });
      bgTo("#bg-emerald", 20.7, 0.4);
      tl.to("#girih", { opacity: 0.5, duration: 0.4 }, 20.7);

      // ================= OUTRO 21.4 → 24.5
      tl.to("#b5", { opacity: 0, scale: 0.3, filter: "blur(20px)", duration: 0.5, ease: "power3.in" }, 21.45);
      minis.forEach((m, i) => tl.to(m, { x: 540 - parseFloat(m.style.left), y: 960 - parseFloat(m.style.top), scale: 0, opacity: 0, duration: 0.7, ease: "power3.in" }, 21.5 + (i % 6) * 0.03));
      tunnelRun(21.5, 1.2, -1);
      bgTo("#bg-gold", 22.0, 0.6);
      tl.fromTo("#outro", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.8, ease: "back.out(1.7)" }, 22.05);
      tl.fromTo("#outro .sub", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 22.25);
      flash(22.05, 0.8, 0.5); shock(22.05, 7, 1.2); shock(22.2, 9, 1.3);
      tl.to("#mandala", { scale: 1.9, opacity: 0.4, duration: 1.0, ease: "expo.out" }, 22.05);
      tl.to("#rays", { opacity: 0.9, duration: 0.8 }, 22.05);
      tl.to("#outro", { scale: 1.06, duration: 1.4, ease: "sine.inOut" }, 22.9);
      lanterns.forEach((l, i) => tl.to(l, { y: -700, duration: 1.2, ease: "power3.in" }, 21.6 + i * 0.05));
      // close
      tl.to("#iris", { opacity: 1, duration: 0.55, ease: "power2.in" }, 23.95);

      tl.set({}, {}, DUR);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
